# npm test on Linux and Windows, Node 22 and 24 (the supported LTS lines; Node 20 is end of life since 2026-04-30).
# Official actions only, pinned by full commit SHA (the version in the comment); runner images by exact label; no
# package install scripts; no secrets; read-only token.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: npm test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]   # exact labels from the actions/runner-images README, never *-latest
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund   # the audit has its own job; no package script runs
      - run: npm test
