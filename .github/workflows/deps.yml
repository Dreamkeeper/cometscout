# Dependency checks, blocking, on every pull request, every push to main and weekly (new advisories arrive without a
# commit here): npm audit at level high over package-lock.json (there are no dev dependencies, so nothing is omitted),
# and the licence allowlist (tools/licenses.mjs) over package-lock.json and the Python packages pinned for the
# transcription module (licences read from PyPI's JSON API, nothing installed). Each check first runs on a deliberate
# violation in a temporary folder outside the checkout and fails if it does NOT complain (the self-test). No package
# script runs; no secrets; read-only token.
name: deps
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Self-test (npm audit must fail on a package with a high advisory)
        run: |
          t="$RUNNER_TEMP/audit-selftest"
          mkdir -p "$t"
          cd "$t"
          # lodash 4.17.20 has high advisories (GHSA-35jh-r3h4-6jhm, GHSA-r5fr-rjxr-66jc). Only a lockfile is
          # written; nothing is installed or run.
          printf '{ "name": "audit-selftest", "version": "1.0.0", "private": true, "dependencies": { "lodash": "4.17.20" } }\n' > package.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --loglevel=error
          set +e
          npm audit --audit-level=high
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "::error::self-test: npm audit did not fail on lodash 4.17.20"; exit 1; fi
          echo "self-test passed: npm audit exited $code on a known vulnerable package"
      - name: npm audit
        run: npm audit --audit-level=high
  licenses:
    name: licences
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Self-test (the licence check must fail on a copyleft package)
        run: |
          t="$RUNNER_TEMP/licenses-selftest"
          mkdir -p "$t"
          printf '{ "lockfileVersion": 3, "packages": { "": {}, "node_modules/copyleft-selftest": { "version": "1.0.0", "license": "GPL-3.0-only" } } }\n' > "$t/package-lock.json"
          set +e
          node tools/licenses.mjs --lock "$t/package-lock.json"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "::error::self-test: the licence check passed a GPL-3.0-only package"; exit 1; fi
          echo "self-test passed: the licence check exited $code on a copyleft package"
      - name: Licences (npm and the pinned Python packages)
        run: node tools/licenses.mjs --python
