# Lints the workflow files (and, once it exists, .github/dependabot.yml) with actionlint and zizmor: on every pull
# request and push to main (no path filter, so it can be a required check), and weekly, because zizmor's online
# audits (known vulnerable actions, impostor commits, a version comment that does not match its SHA) change without a
# commit here. Blocking: any finding fails the job. Before the real run, each tool is run on a deliberate violation
# written to a temporary folder outside the checkout, and the job fails if the tool does NOT complain (the self-test).
# Both tools are pinned: actionlint by its release archive's sha256, zizmor by its image digest. No secrets; read-only token.
name: workflow-lint
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'   # Mondays 05:41 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # https://github.com/rhysd/actionlint/releases/tag/v1.7.12 (2026-03-30); sha256 of actionlint_1.7.12_linux_amd64.tar.gz
      # from that release's actionlint_1.7.12_checksums.txt
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      # https://github.com/zizmorcore/zizmor/releases/tag/v1.30.1 (2026-09-09); index digest from ghcr.io
      ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.30.1@sha256:a2eb396d886c053073405c7a980f2139ba2248ec172243cfa3841e57196e8101
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (release archive, checked against its sha256)
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          cd "$RUNNER_TEMP/actionlint"
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -version
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Pull zizmor (image by digest)
        run: docker pull "$ZIZMOR_IMAGE"
      - name: Self-test (both tools must flag a deliberate violation)
        run: |
          d="$RUNNER_TEMP/lint-selftest"
          mkdir -p "$d/.github/workflows"
          # A workflow with an action pinned by tag (zizmor: unpinned-uses) and a job that needs a job that does not
          # exist (actionlint). It lives only in the temporary folder.
          cat > "$d/.github/workflows/bad.yml" <<'YAML'
          name: bad
          on: push
          permissions:
            contents: read
          jobs:
            one:
              runs-on: ubuntu-24.04
              needs: no-such-job
              steps:
                - uses: actions/checkout@v7.0.1
                  with:
                    persist-credentials: false
                - run: echo one
          YAML
          set +e
          actionlint -no-color "$d/.github/workflows/bad.yml" > "$d/actionlint.out" 2>&1
          a=$?
          docker run --rm -v "$d:/workspace:ro" -w /workspace "$ZIZMOR_IMAGE" --no-online-audits --color=never . > "$d/zizmor.out" 2>&1
          z=$?
          set -e
          echo "actionlint exit $a:"; cat "$d/actionlint.out"
          echo "zizmor exit $z:"; cat "$d/zizmor.out"
          fail=0
          if [ "$a" -eq 0 ] || ! grep -q 'no-such-job' "$d/actionlint.out"; then echo "::error::self-test: actionlint did not flag the missing job"; fail=1; fi
          if [ "$z" -lt 11 ] || ! grep -q 'unpinned-uses' "$d/zizmor.out"; then echo "::error::self-test: zizmor did not flag the action pinned by tag"; fail=1; fi
          exit "$fail"
      - name: actionlint
        run: actionlint -color
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}   # read-only; for the online audits
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace -e GH_TOKEN "$ZIZMOR_IMAGE" --persona=regular --color=always .
