# Secret scanning: Betterleaks over the full git history (every branch and tag the checkout fetches), on every pull
# request and every push to main. Blocking: a finding fails the job. Before the real scan, the job writes a fake
# credential, generated at run time, into a throwaway git repository in a temporary folder outside the checkout and
# fails if Betterleaks does NOT flag it (the self-test); the fake value never reaches this repository. Inline
# "betterleaks:allow" or "gitleaks:allow" comments are ignored, so an exception can only be a reviewed entry in a
# config file. The container runs as the runner's user, so git accepts the mounted repository as its own (git
# refusing it gives a partial scan with exit code 1, which the self-test catches). The image is pinned by digest. No
# validation against live APIs (off by default). No secrets; read-only token.
name: secrets
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # https://github.com/betterleaks/betterleaks/releases/tag/v1.9.0 (2026-09-29); index digest from ghcr.io
      BETTERLEAKS_IMAGE: ghcr.io/betterleaks/betterleaks:v1.9.0@sha256:e3b95b0db6c2735db17165c009b0ad6d9cef34fb4578659232b98f69d7346cac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, not only the last commit
          persist-credentials: false
      - name: Pull Betterleaks (image by digest)
        run: docker pull "$BETTERLEAKS_IMAGE"
      - name: Self-test (Betterleaks must flag a fake credential)
        run: |
          t="$RUNNER_TEMP/secrets-selftest"
          mkdir -p "$t/repo" "$t/out"
          chmod 777 "$t/out"
          cd "$t/repo"
          git init -q
          # A GitHub token shape with 36 random characters, made now; it is not a real token and is never pushed.
          fake="ghp_$(head -c 4096 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'GITHUB_TOKEN=%s\n' "$fake" > config.env
          git add config.env
          git -c user.name=selftest -c user.email=selftest@example.invalid commit -q -m "self-test"
          set +e
          docker run --rm --user "$(id -u):$(id -g)" -v "$t/repo:/repo:ro" -v "$t/out:/out" "$BETTERLEAKS_IMAGE" \
            git /repo --no-banner --redact --report-format json --report-path /out/report.json
          code=$?
          set -e
          echo "Betterleaks exit code on the self-test repository: $code"
          if [ "$code" -eq 0 ] || ! grep -q '"RuleID": *"github-pat"' "$t/out/report.json"; then
            echo "::error::self-test: Betterleaks did not flag the fake credential"
            exit 1
          fi
          echo "self-test passed: the fake credential was flagged (rule github-pat)"
      - name: Betterleaks (full git history)
        run: |
          out="$RUNNER_TEMP/secrets-scan"
          mkdir -p "$out"
          chmod 777 "$out"
          set +e
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo:ro" -v "$out:/out" "$BETTERLEAKS_IMAGE" \
            git /repo --no-banner --redact --ignore-gitleaks-allow --report-format json --report-path /out/report.json
          code=$?
          set -e
          # Rule, file, line, commit and fingerprint only: the verbose output would also print commit authors and
          # messages into this public log. A fingerprint is what an entry in .betterleaksignore names.
          if [ -s "$out/report.json" ]; then
            jq -r '.[] | "\(.RuleID)  \(.File):\(.StartLine)  commit \(.Commit[0:12])  fingerprint \(.Fingerprint)"' "$out/report.json"
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::Betterleaks exited with $code (findings above, or a scan that did not complete)"
            exit "$code"
          fi
